# Local development database for PerkPilot (optional).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: perkpilot
      POSTGRES_PASSWORD: perkpilot
      POSTGRES_DB: perkpilot
    ports:
      - "5432:5432"
    volumes:
      - perkpilot-db:/var/lib/postgresql/data
volumes:
  perkpilot-db:
