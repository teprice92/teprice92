# One-off helper: downloads the Higgsfield-generated title art, commits it
# (converted to JPEG afterwards). Triggered by pushing this file.
name: Fetch title art

on:
  push:
    branches: [ccr-c2dbc4fc-kuhpy2]
    paths: ['.github/workflows/fetch-art.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          set -e
          mkdir -p shinobi-shadows/assets/art
          cd shinobi-shadows/assets/art
          BASE=https://d8j0ntlcm91z4.cloudfront.net/user_3F3kQmi11cKqi7WdSoOxdUMXWue
          curl -fSL --retry 3 -o title-c.png "$BASE/hf_20261020_031912_38a76c30-750a-4dd5-97ba-4dfb89703544.png"
          curl -fSL --retry 3 -o title-d.png "$BASE/hf_20261020_031912_67598f07-a9e5-49ba-b96c-646645c30a69.png"
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shinobi-shadows/assets/art
          git commit -m "Add Higgsfield-generated title art"
          git push
